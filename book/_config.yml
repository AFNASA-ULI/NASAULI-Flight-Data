# Jupyter Book settings for the flight-data website.
# The pages under experiments/ and data/ and the table of contents (_toc.yml) are generated by
# `python -m nasauli site`; edit intro.md, contributing.md and this file by hand.
# Learn more at https://jupyterbook.org/customize/config.html

title: NASA ULI Flight Data
author: AFNASA-ULI
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/AFNASA-ULI/NASAULI-Flight-Data
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true

sphinx:
  config:
    html_static_path: ["_static"]
    html_css_files: ["custom.css"]
    myst_heading_anchors: 3
    html_theme_options:
      show_navbar_depth: 1
      repository_url: https://github.com/AFNASA-ULI/NASAULI-Flight-Data
      use_repository_button: true
      use_issues_button: true

parse:
  myst_enable_extensions:
    - colon_fence
    - linkify
    - substitution
    - dollarmath
